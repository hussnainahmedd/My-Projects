<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product History - Stock Management System</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-image: url('https://www.shutterstock.com/image-photo/stock-market-forex-trading-graph-600nw-552445588.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: rgba(255, 255, 255, 0.95);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    }

    h1 {
      text-align: center;
      color: #0d6efd;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }

    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ccc;
    }

    th {
      background-color: #0d6efd;
      color: white;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .btn {
      display: inline-block;
      padding: 12px 20px;
      background-color: #0d6efd;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn:hover {
      background-color: #0b5ed7;
    }

    .text-center {
      text-align: center;
    }

    #logoutBtn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="logoutBtn">Logout</button>
    <h1>Product History</h1>

    <table id="historyTable">
      <thead>
        <tr>
          <th>Action</th>
          <th>Item Name</th>
          <th>Category</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody>
     
      </tbody>
    </table>

    <div class="text-center">
      <a href="index.html" class="btn">⬅ Back to Home</a>
    </div>
  </div>

  <script>
  
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    async function loadHistory() {
      try {
        const res = await fetch('/api/history', {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
        
        if (res.status === 401 || res.status === 403) {
          window.location.href = 'login.html';
          return;
        }
        
        const data = await res.json();
        const tbody = document.querySelector('#historyTable tbody');

        if (data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No history records found.</td></tr>';
          return;
        }

        data.forEach(item => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${item.action}</td>
            <td>${item.itemName}</td>
            <td>${item.category}</td>
            <td>${item.quantity}</td>
            <td>${item.price}</td>
            <td>${new Date(item.timestamp).toLocaleString()}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        console.error('Error loading history:', error);
      }
    }

    loadHistory();
  </script>
</body>
</html>
