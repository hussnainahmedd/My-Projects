<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stock Management System - Add & Update Items</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body, html {
      height: 100%;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background-image: url("https://images.unsplash.com/photo-1748132188311-c22db67dcef6?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwyNnx8fGVufDB8fHx8fA%3D%3D");
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center;
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 20px;
    }

    .container {
      background-color: rgba(255, 255, 255, 0.95);
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(241, 241, 241, 0.1);
      width: 100%;
      max-width: 700px;
      max-height: 90vh;
      overflow-y: auto;
      background-image: url("https://media.istockphoto.com/id/1426988809/photo/security-password-login-online-concept-hands-typing-and-entering-username-and-password-of.webp?a=1&b=1&s=612x612&w=0&k=20&c=BTspwjr2ge2qMLcUydDb-OeZ01dXaL6uGHgGjLtzKzg=");
    }

    h1, h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #0d6efd;
      font-weight: 700;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 30px;
    }

    label {
      font-weight: 600;
      color: #fffbfb;
    }

    input[type="text"],
    input[type="number"] {
      padding: 12px 15px;
      border-radius: 8px;
      border: 1.8px solid #ccc;
      font-size: 1rem;
      transition: border-color 0.3s ease;
      width: 100%;
      box-sizing: border-box;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #0d6efd;
      outline: none;
      box-shadow: 0 0 8px #0d6efd88;
    }

    button {
      padding: 14px 0;
      border-radius: 12px;
      font-size: 1.1rem;
      font-weight: 700;
      background-color: #0d6efd;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #0b5ed7;
    }

    #message {
      margin-top: 20px;
      font-weight: 600;
      text-align: center;
    }

    .alert-success {
      color: #155724;
      background-color: #d4edda;
      padding: 10px;
      border-radius: 8px;
    }

    .alert-danger {
      color: #721c24;
      background-color: #f8d7da;
      padding: 10px;
      border-radius: 8px;
    }

    #itemsList {
      margin-top: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      box-shadow: 0 4px 15px rgba(223, 220, 220, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ddd;
      font-size: 0.95rem;
    }

    th {
      background-color: #0d6efd;
      color: white;
    }

    tr:hover {
      background-color: #f1f9ff;
    }

    .delete-btn {
      background-color: #dc3545;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease;
      margin-right: 8px;
    }

    .delete-btn:hover {
      background-color: #b02a37;
    }

    .update-btn {
      background-color: #198754;
      border: none;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease;
    }

    .update-btn:hover {
      background-color: #145c32;
    }

    .history-link {
      text-align: center; 
      margin-top: 20px;
    }

    .history-link a {
      font-weight: bold; 
      color: #0d6efd; 
      text-decoration: underline;
      cursor: pointer;
    }

    #logoutBtn {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button id="logoutBtn">Logout</button>
    <h1>Stock Management System</h1>

    <h2>Add New Item</h2>
    <form id="itemForm">
      <label for="name">Item Name</label>
      <input type="text" id="name" name="name" placeholder="Enter item name" required />

      <label for="category">Category</label>
      <input type="text" id="category" name="category" placeholder="Enter category" required />

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" name="quantity" placeholder="Enter quantity" required min="0" />

      <label for="price">Price</label>
      <input type="number" id="price" name="price" placeholder="Enter price" required min="0" step="0.01" />

      <button type="submit">Add Item</button>
    </form>

    <div class="history-link">
      <a href="product-history.html">📜 View Product History</a>
    </div>

    <div id="message"></div>

    <div id="itemsList">
      <h2>Added Items</h2>
      <table>
        <thead>
          <tr>
            <th>Item Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="itemsTableBody">
      
        </tbody>
      </table>
    </div>
  </div>

  <script>
    
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'login.html';
    }

    const form = document.getElementById('itemForm');
    const messageBox = document.getElementById('message');
    const itemsTableBody = document.getElementById('itemsTableBody');

    function showMessage(text, type='success') {
      messageBox.textContent = text;
      messageBox.className = type === 'success' ? 'alert-success' : 'alert-danger';
      setTimeout(() => {
        messageBox.textContent = '';
        messageBox.className = '';
      }, 3000);
    }

    async function authFetch(url, options = {}) {
      return fetch(url, {
        ...options,
        headers: {
          ...(options.headers || {}),
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        }
      });
    }

    async function loadItems() {
      try {
        const res = await authFetch('/api/items');
        
        if (res.status === 401 || res.status === 403) {
          window.location.href = 'login.html';
          return;
        }
        
        if (!res.ok) throw new Error('Failed to fetch items');
        
        const items = await res.json();

        if (!items.length) {
          itemsTableBody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding: 15px;">No items found.</td></tr>`;
          return;
        }

        itemsTableBody.innerHTML = '';
        items.forEach(item => {
          const tr = document.createElement('tr');

          tr.innerHTML = `
            <td><input type="text" value="${item.name}" data-id="${item._id}" data-field="name" /></td>
            <td><input type="text" value="${item.category}" data-id="${item._id}" data-field="category" /></td>
            <td><input type="number" value="${item.quantity}" data-id="${item._id}" data-field="quantity" min="0" /></td>
            <td><input type="number" value="${item.price.toFixed(2)}" data-id="${item._id}" data-field="price" min="0" step="0.01" /></td>
            <td>
              <button class="update-btn" data-id="${item._id}">Update</button>
              <button class="delete-btn" data-id="${item._id}">Delete</button>
            </td>
          `;

          itemsTableBody.appendChild(tr);
        });
      } catch (error) {
        showMessage('Error loading items: ' + error.message, 'danger');
      }
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();

      const name = form.name.value.trim();
      const category = form.category.value.trim();
      const quantity = Number(form.quantity.value);
      const price = Number(form.price.value);

      if (!name || !category || quantity < 0 || price < 0) {
        showMessage('Please provide valid input values', 'danger');
        return;
      }

      try {
        const res = await authFetch('/api/items', {
          method: 'POST',
          body: JSON.stringify({ name, category, quantity, price })
        });

        if (!res.ok) throw new Error('Failed to add item');

        showMessage('Item added successfully');
        form.reset();
        loadItems();
      } catch (error) {
        showMessage('Error adding item: ' + error.message, 'danger');
      }
    });

 
    itemsTableBody.addEventListener('click', async e => {
      if (e.target.classList.contains('delete-btn')) {
      
        const id = e.target.getAttribute('data-id');
        if (confirm('Are you sure you want to delete this item?')) {
          try {
            const res = await authFetch(`/api/items/${id}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Failed to delete item');
            showMessage('Item deleted successfully');
            loadItems();
          } catch (error) {
            showMessage('Error deleting item: ' + error.message, 'danger');
          }
        }
      } else if (e.target.classList.contains('update-btn')) {
      
        const id = e.target.getAttribute('data-id');
        const row = e.target.closest('tr');
        const inputs = row.querySelectorAll('input');

        const updatedItem = {};
        inputs.forEach(input => {
          const field = input.getAttribute('data-field');
          if (field === 'quantity' || field === 'price') {
            updatedItem[field] = Number(input.value);
          } else {
            updatedItem[field] = input.value.trim();
          }
        });

        if (!updatedItem.name || !updatedItem.category || updatedItem.quantity < 0 || updatedItem.price < 0) {
          showMessage('Please provide valid input values for update', 'danger');
          return;
        }

        try {
          const res = await authFetch(`/api/items/${id}`, {
            method: 'PUT',
            body: JSON.stringify(updatedItem)
          });

          if (!res.ok) throw new Error('Failed to update item');

          showMessage('Item updated successfully');
          loadItems();
        } catch (error) {
          showMessage('Error updating item: ' + error.message, 'danger');
        }
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    });

    loadItems();
  </script>
</body>
</html>
